[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poolgate"
version = "0.1.0"
description = "Recovery gate for talent-pool matching: plant known fits and near-misses in a synthetic candidate pool, run the matcher, score who reaches the shortlist, who is missed and why, and whether the ranking moves when only the name changes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Cedric Conday"}]
keywords = ["recruiting", "talent pool", "LLM evaluation", "matching", "fairness", "ground truth"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/CedricConday/poolgate"

[project.scripts]
poolgate = "poolgate.cli:main"

[tool.setuptools.packages.find]
include = ["poolgate*"]

[tool.ruff]
line-length = 100
target-version = "py311"
